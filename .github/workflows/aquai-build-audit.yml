name: AQU.AI Build & Type Audit

on:
  push:
    branches:
      - aquai-v2-foundation
  pull_request:

jobs:
  build-and-type-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript audit
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
